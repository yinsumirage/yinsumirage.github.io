locale                   : "en-US"
title                    : "Wentao Guo"
title_separator          : "-"
name                     : "Wentao Guo"
description              : "Wentao Guo - Ph.D. student at The University of Hong Kong working on Robotics and Embodied AI, focused on data-centric robot learning and task-aware robotic hands."
url                      : "https://yinsumirage.github.io"
baseurl                  : ""
repository               : "yinsumirage/yinsumirage.github.io"

author:
  avatar           : "profile.jpg"
  name             : "Wentao Guo"
  pronouns         :
  bio              : "Fake it until you make it."
  location         : "Shenzhen, China"
  employer         :
  uri              :
  email            : "yinsumirage@gmail.com"
  cv_en            : "/assets/cv/WentaoGuo_CV.pdf"

  arxiv            :
  googlescholar    : "https://scholar.google.com/citations?hl=zh-CN&user=Ky84MtsAAAAJ"
  impactstory      :
  orcid            :
  semantic         :
  pubmed           :
  researchgate     :

  bitbucket        :
  codepen          :
  dribbble         :
  github           : "yinsumirage"
  kaggle           :
  stackoverflow    :

  WeChat           : "yinsumirage"
  linkedin         :
  bilibili         :
  twitter          :
  youtube          :
  zhihu            :
  XiaoHongShu      : "https://www.xiaohongshu.com/user/profile/671921b8000000001d021c3b"

teaser                   :
breadcrumbs              : false
words_per_minute         : 250
future                   : true
read_more                : "disabled"
talkmap_link             : false

comments:
  provider               :
  disqus:
    shortname            :
  discourse:
    server               :
  facebook:
    appid                :
    num_posts            :
    colorscheme          :

staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601"

atom_feed:
  hide                   : false
  path                   :

google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

twitter:
  username               : &twitter
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 :
social:
  type                   : Person
  name                   : "Wentao Guo"
  links:                   # "sameAs" profiles for search engines
    - "https://github.com/yinsumirage"
    - "https://scholar.google.com/citations?user=Ky84MtsAAAAJ"
    - "https://www.xiaohongshu.com/user/profile/671921b8000000001d021c3b"

analytics:
  provider               : false
  google:
    tracking_id          :

include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:year/:title/
      lang: en
      author_profile: true
      stylesheets:
        - /assets/css/home.css
        - /assets/css/blog.css
  # Chinese versions: same filename as the English post, under _posts/zh/.
  - scope:
      path: "_posts/zh"
      type: posts
    values:
      permalink: /blog/:year/:title/zh/
      lang: zh
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: UTC

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from

whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji


compress_html:
  clippings: all
  ignore:
    envs: development
